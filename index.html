<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz de preparação para exame teórico de condução.">
  <title>Quiz de Condução</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topo">
      <div>
        <p class="rotulo">PREPARAÇÃO</p>
        <h1>Quiz de Condução</h1>
        <p class="subtitulo">Questões baseadas nos exames fornecidos.</p>
      </div>
      <div class="placar" aria-live="polite">
        <span id="progresso">1/16</span>
        <strong id="pontuacao">0 pontos</strong>
      </div>
    </header>

    <section class="barra">
      <div id="barra-progresso"></div>
    </section>

    <section id="quiz" class="cartao">
      <div class="questao-topo">
        <span id="numero">Questão 1</span>
      </div>

      <h2 id="pergunta"></h2>

      <div id="opcoes" class="opcoes"></div>

      <p id="resultado" class="resultado" role="status"></p>

      <div class="acoes">
        <button id="confirmar" class="btn principal">Confirmar</button>
        <button id="proxima" class="btn secundario" hidden>Próxima</button>
      </div>
    </section>

    <section id="final" class="cartao final" hidden>
      <p class="rotulo">RESULTADO</p>
      <h2>Quiz concluído</h2>
      <p id="resumo"></p>
      <button id="reiniciar" class="btn principal">Recomeçar</button>
    </section>

    <footer>
      <p>Conteúdo baseado nos documentos de exame fornecidos pelo utilizador.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
